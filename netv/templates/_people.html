{# Each name searches the role it is listed under, e.g. cast:"Olga Kurylenko". #}
{% macro people(label, field, names, spacing) %}
{% if names %}
<p class="text-sm text-gray-400 {{ spacing }}"><span class="text-gray-500">{{ label }}:</span>
  {%- for name in names %}
  <a href="/search?q={{ (field ~ ':"' ~ name ~ '"') | urlencode }}" class="inline-block py-1 hover:text-blue-400 hover:underline focusable rounded focus:outline-none focus:ring-2 focus:ring-blue-500" tabindex="0">{{ name }}</a>{% if not loop.last %},{% endif %}
  {%- endfor %}
</p>
{% endif %}
{% endmacro %}
