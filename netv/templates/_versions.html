{# The credits table's Source row: the provider's listings of one movie or series,
   one per line, the one on show marked. #}
{% macro sources(versions) %}
{% if versions %}
<dt class="text-gray-500 py-1">Source</dt>
<dd class="text-gray-400" data-nav="list">
  {%- for v in versions %}
  <a href="{{ v.href }}"
     class="block w-fit py-1 rounded hover:text-blue-400 focusable focus:outline-none focus:ring-2 focus:ring-blue-500{% if v.current %} text-white{% endif %}"
     tabindex="0" data-version="{{ v.id }}"{% if v.current %} aria-current="true"{% endif %}>{{ v.label }}</a>
  {%- endfor %}
</dd>
{% endif %}
{% endmacro %}
