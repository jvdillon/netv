{# A title's trailer, embedded paused: it plays only when clicked. #}
{% macro trailer(field) %}
{% set video = field | youtube_id %}
{% if video %}
<div class="w-full aspect-video">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ video }}" title="Trailer" loading="lazy"
          class="w-full h-full rounded-lg" referrerpolicy="strict-origin-when-cross-origin"
          allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
{% endif %}
{% endmacro %}
