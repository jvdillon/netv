# Optional Linux host networking for Chromecast mDNS discovery.
# Requires Docker Compose 2.24+ for !reset.
# docker compose -f docker-compose.yml -f docker/compose.cast.yml up -d --build netv
services:
  netv:
    network_mode: host
    ports: !reset []
    environment:
      NETV_PORT: ${NETV_PORT:-8000}
  netv-nvidia:
    network_mode: host
    ports: !reset []
    environment:
      NETV_PORT: ${NETV_PORT:-8000}
