name: neTV
options:
  bundleIdPrefix: com.netv
  xcodeVersion: "2660"
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  neTV-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS/Assets.xcassets
      - PrivacyInfo.xcprivacy
      - Resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - netv
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        DEVELOPMENT_TEAM: $(NETV_DEVELOPMENT_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: $(NETV_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: neTV
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
  neTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - Shared
      - tvOS/Assets.xcassets
      - PrivacyInfo.xcprivacy
      - Resources
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
    settings:
      base:
        DEVELOPMENT_TEAM: $(NETV_DEVELOPMENT_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: $(NETV_BUNDLE_IDENTIFIER)
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.1
        PRODUCT_NAME: neTV
        TARGETED_DEVICE_FAMILY: "3"
    scheme:
      testTargets: []
  neTV-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS/Assets.xcassets
      - PrivacyInfo.xcprivacy
      - Resources
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - netv
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: macOS/neTV.entitlements
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: $(NETV_DEVELOPMENT_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: $(NETV_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: neTV
    scheme:
      testTargets: []
