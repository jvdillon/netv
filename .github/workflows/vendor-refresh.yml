name: Vendor Refresh

# Keeps the JavaScript in netv/static/vendor (htmx, hls.js) current without anyone watching
# for releases. Weekly, or on demand, it asks the npm registry for the newest release of each
# library and, if there is one, opens a pull request that:
#   - replaces the vendored file (renamed with the new version),
#   - updates the <script> tag in netv/templates/base.html,
#   - recomputes the SHA-384 in netv/static/vendor/VENDOR.md,
#   - passes the test suite (including netv/vendor_test.py).
#
# Stays within the current major version (htmx 2.x, hls.js 1.x). A new major changes behavior
# and is a deliberate edit to PACKAGES in scripts/vendor_refresh.py, not something a cron job
# should merge.
#
# Each tarball comes from registry.npmjs.org and is checked against the registry's
# dist.integrity (sha512) before the dist file is extracted. No CDN copy is trusted.
# The logic lives in scripts/vendor_refresh.py so it can be run and tested locally:
#   python3 scripts/vendor_refresh.py --dry-run
#
# Setup: Settings > Actions > General > "Allow GitHub Actions to create pull requests".
# Pull requests opened with GITHUB_TOKEN do not start other workflows (CI will not run on
# them) until a maintainer pushes to the branch or closes and reopens the PR. To have CI run
# automatically, create the PR with a personal access token or GitHub App token instead.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC.
  workflow_dispatch:

# One refresh at a time; a late run waits instead of racing the branch update.
concurrency:
  group: vendor-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: chore/vendor-refresh

jobs:
  # Needs no write access: it downloads and verifies, tests the result, and hands over a patch.
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh vendored files
        id: refresh
        run: |
          mkdir -p "$RUNNER_TEMP/vendor-refresh"
          python3 scripts/vendor_refresh.py --summary-file "$RUNNER_TEMP/vendor-refresh/summary.md"
          git add -A netv/static/vendor netv/templates/base.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > "$RUNNER_TEMP/vendor-refresh/vendor.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The steps below mirror ci.yml, so the refresh is tested the way a pull request is.
      - name: Set up Python
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"

      - name: Install uv
        if: steps.refresh.outputs.changed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14.10"

      - name: Install FFmpeg
        if: steps.refresh.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install dependencies
        if: steps.refresh.outputs.changed == 'true'
        run: uv sync --frozen --group pre-commit --no-group default-cuda --extra cpu

      - name: Run tests
        if: steps.refresh.outputs.changed == 'true'
        run: uv --quiet run --frozen --group pre-commit --no-group default-cuda --extra cpu pytest

      - name: Upload patch
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-refresh
          path: ${{ runner.temp }}/vendor-refresh
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It applies the patch, and nothing else, to a fresh checkout.
  open-pr:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Credentials stay persisted because this job pushes. It uploads no artifact, so there
      # is nothing for them to leak into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-refresh
          path: ${{ runner.temp }}/vendor-refresh

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          # Only the vendored files and the template that loads them may change.
          git apply --index --binary \
            --include='netv/static/vendor/*' --include='netv/templates/base.html' \
            "$RUNNER_TEMP/vendor-refresh/vendor.patch"
          git commit --message "Update vendored JavaScript" --message "$(cat "$RUNNER_TEMP/vendor-refresh/summary.md")"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "Update vendored JavaScript" --body-file "$RUNNER_TEMP/vendor-refresh/summary.md"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "Update vendored JavaScript" \
              --body-file "$RUNNER_TEMP/vendor-refresh/summary.md"
          fi
