name: AI Upscale Image

on:
  # Run manually when an FFmpeg base-image update should be published immediately.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.ai_upscale"
      - "docker/entrypoint-ai_upscale.sh"
      - "netv/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/ai-upscale.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ai-upscale
  DEFAULT_BASE: ubuntu:26.04

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing combination must not cancel the others.
      fail-fast: false
      matrix:
        # Mirrors ffmpeg-base.yml: each image builds on the ffmpeg image of the same CUDA and OS.
        nvidia: ['cuda:12.4', 'cuda:12.6', 'cuda:12.8', 'cuda:13.0']
        base_image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']

    steps:
      - name: Free disk space
        run: |
          # Remove large unnecessary packages to free up space for torch/tensorrt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse CUDA version
        id: cuda
        run: |
          # Extract "12.4" from "cuda:12.4"
          CUDA_VER="${{ matrix.nvidia }}"
          CUDA_VER="${CUDA_VER#cuda:}"
          echo "version=$CUDA_VER" >> $GITHUB_OUTPUT
          # "ubuntu:26.04" -> "ubuntu26.04"
          OS="${{ matrix.base_image }}"
          echo "os=${OS/:/}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cuda${{ steps.cuda.outputs.version }}-${{ steps.cuda.outputs.os }}
            type=raw,value=cuda${{ steps.cuda.outputs.version }},enable=${{ matrix.base_image == env.DEFAULT_BASE }}
            type=raw,value=latest,enable=${{ matrix.base_image == env.DEFAULT_BASE && steps.cuda.outputs.version == '13.0' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ai_upscale
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FFMPEG_IMAGE=ghcr.io/${{ github.repository }}-ffmpeg:cuda${{ steps.cuda.outputs.version }}-${{ steps.cuda.outputs.os }}
            NVIDIA=${{ matrix.nvidia }}
            BASE_IMAGE=${{ matrix.base_image }}
          no-cache: true

      - name: Verify image
        run: |
          # Free space: BuildKit uses separate storage, prune it before pulling
          docker buildx prune -af || true
          docker system prune -af || true
          df -h
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda${{ steps.cuda.outputs.version }}-${{ steps.cuda.outputs.os }}
          docker pull $IMG
          # Verify everything that should be enabled is actually linked
          # Note: --entrypoint bypasses the default entrypoint which tries to build TensorRT engines (requires GPU)
          docker run --rm --entrypoint sh "$IMG" -c "
            echo '=== Verifying AI Upscale build ==='
            LDD_OUTPUT=\$(ldd /usr/local/bin/ffmpeg)

            # Verify ffmpeg binaries exist
            for bin in ffmpeg ffprobe ffplay; do
              test -x /usr/local/bin/\$bin || { echo \"ERROR: \$bin not found\"; exit 1; }
              echo \"OK: \$bin exists\"
            done

            # Verify non-NVIDIA dependencies are satisfied
            # Note: All NVIDIA libraries (libnvinfer, libcuda, libcudart) are loaded via dlopen,
            # so ffmpeg works even without NVIDIA GPU/drivers installed
            MISSING=\$(echo \"\$LDD_OUTPUT\" | grep 'not found' | grep -v -E 'libnvinfer|libnvonnxparser|libcudart|libcuda' || true)
            if [ -n \"\$MISSING\" ]; then
              echo 'ERROR: Missing non-NVIDIA libraries:'
              echo \"\$MISSING\"
              exit 1
            fi
            echo 'OK: All non-NVIDIA dependencies satisfied'

            # Verify ffmpeg has NO hard CUDA dependency (all CUDA/TensorRT loaded via dlopen)
            if echo \"\$LDD_OUTPUT\" | grep -q 'libcudart'; then
              echo 'ERROR: libcudart linked at compile time (should use dlopen)'
              exit 1
            fi
            echo 'OK: No libcudart dependency (CUDA Driver API via dlopen)'
            echo 'OK: libnvinfer loaded via dlopen (not in ldd output)'

            # Verify Python AI packages installed (use pip show, not import - import needs CUDA runtime)
            echo '=== Verifying Python packages ==='
            pip3 show torch >/dev/null 2>&1 || { echo 'ERROR: torch not installed'; exit 1; }
            echo 'OK: torch installed'
            pip3 show onnx >/dev/null 2>&1 || { echo 'ERROR: onnx not installed'; exit 1; }
            echo 'OK: onnx installed'
            # torch only exports ONNX on the CPU; a CUDA build ties the image to a driver floor
            # and GPU-architecture list it does not need.
            python3 -c 'import torch; assert torch.version.cuda is None, torch.version.cuda' || { echo 'ERROR: torch is a CUDA build'; exit 1; }
            echo 'OK: torch is the CPU build'

            # Engines load only in the TensorRT release that built them: the engine builder
            # (trtexec) must be the release FFmpeg loads (libnvinfer10).
            echo '=== Verifying TensorRT engine builder ==='
            NVINFER=\$(dpkg-query -W -f='\${Version}' libnvinfer10)
            TRTEXEC=\$(dpkg-query -W -f='\${Version}' libnvinfer-bin)
            [ -n \"\$NVINFER\" ] && [ \"\$NVINFER\" = \"\$TRTEXEC\" ] || { echo \"ERROR: trtexec \$TRTEXEC != libnvinfer10 \$NVINFER\"; exit 1; }
            command -v trtexec >/dev/null || { echo 'ERROR: trtexec not on PATH'; exit 1; }
            echo \"OK: trtexec and libnvinfer10 are both \$NVINFER\"

            # Verify AI upscale scripts exist
            echo '=== Verifying AI upscale scripts ==='
            test -x /app/scripts/install-ai_upscale.sh || { echo 'ERROR: install-ai_upscale.sh not found'; exit 1; }
            echo 'OK: install-ai_upscale.sh exists'
            test -f /app/netv/upscale/export_tensorrt.py || { echo 'ERROR: export_tensorrt.py not found'; exit 1; }
            echo 'OK: export_tensorrt.py exists'
            python3 -m netv.upscale.export_tensorrt --list | grep -q '2x-nomosuni-compact' || { echo 'ERROR: Nomos model unavailable'; exit 1; }
            if python3 -m netv.upscale.export_tensorrt --help | grep -q -- '--model'; then
              echo 'ERROR: Legacy model selection is still available'
              exit 1
            fi
            echo 'OK: Nomos is the sole supported model'

            echo ''
            echo '=== All verifications passed ==='
          "
