name: CI

on:
  # Run manually when an FFmpeg base-image update should be published immediately.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only trigger on files used by main Dockerfile
      - "Dockerfile"
      - "*.py"
      - "pyproject.toml"
      - "templates/**"
      - "static/**"
      - "entrypoint.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FFMPEG_IMAGE: ghcr.io/${{ github.repository }}-ffmpeg:latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with basedpyright
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify base image exists
        run: |
          if ! docker manifest inspect ${{ env.FFMPEG_IMAGE }} > /dev/null 2>&1; then
            echo "ERROR: Base image ${{ env.FFMPEG_IMAGE }} not found"
            echo "Run the 'FFmpeg Base Image' workflow first"
            exit 1
          fi
          echo "Base image verified: ${{ env.FFMPEG_IMAGE }}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FFMPEG_IMAGE=${{ env.FFMPEG_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
