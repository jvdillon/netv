n kernels", "gpu_jax_cuda: requires JAX CUDA execution", "gpu_nvidia: requires NVIDIA GPU hardware", "gpu_torch_cuda: requires torch CUDA execution", "gpu_torch_mps: requires torch MPS execution", "gpu_triton: requires Triton kernels", "network_anthropic: reaches Anthropic over the network", "network_duckduckgo: reaches DuckDuckGo over the network", "network_e2b: reaches E2B over the network", "network_gemini: reaches Gemini over the network", "network_google_search: reaches Google Search over the network", "network_github: reaches GitHub over the network", "network_huggingface: reaches Hugging Face over the network", "network_kaggle: reaches Kaggle over the network", "network_localhost: opens a loopback network socket", "network_openai: reaches OpenAI over the network", "network_openml: reaches OpenML over the network", "network_openreview: reaches OpenReview over the network", "network_pypi: reaches PyPI over the network", "network_searxng: reaches a SearXNG service over the network", "network_gpu_cloud: reaches a GPU cloud provider over the network", "network_slack: reaches Slack over the network", "network_wandb: reaches Weights & Biases over the network"]
