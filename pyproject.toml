[tool.codedoctor.managed.mutmut]
mutate_only_covered_lines = true
source_paths = ["."]
pytest_add_cli_args = ["-p", "no:jaxtyping"]
do_not_mutate_patterns = ["^\\s*help=(\"[^\"]*\"\\s*)+,?\\s*$", "^\\s*(description|formatter_class)=[\\w.]+,?\\s*$"]

[tool.codedoctor.managed.coverage-floor]
floor = ["=100"]

[tool.codedoctor.managed.coverage.run]
core = "sysmon"
omit = ["*_test.py", "test_*.py", "*/tests/*", "*/.venv/*", "*/typings/*", "*/testdata/*", "*/__main__.py"]

[tool.codedoctor.managed.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError", "^\\s*\\.\\.\\.$", "^def \\w+_triton\\(", "^def \\w+_numba\\("]
