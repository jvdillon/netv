select = "ALL"
fix = "ALL"
exclude = ["*_test.py test_*.py **/tests/test*.py =\n    args-section assert cache-kwarg def-order final-inline globals\n    lazy-import-cost mkdir-mode module-side-effects nested-def returns-named\n    returns-section single-use-helper tempfile-prefix tensor-value-guard\n    tmp-literal xdg-literal", "conftest.py =\n    args-section def-order lazy-import-cost module-side-effects returns-section"]
set = ["import-alias.first-party=netv", "test-footer.runner=codedoctor.lib.testing.runner", "userdirs-namespace.namespace=netv"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError", "^\\s*\\.\\.\\.$", "^def \\w+_triton\\(", "^def \\w+_numba\\("]
show_missing = true
skip_covered = true

[tool.coverage.run]
core = "sysmon"
omit = ["*_test.py", "test_*.py", "*/tests/*", "*/.venv/*", "*/typings/*", "*/testdata/*", "*/__main__.py"]

[tool.mutmut]
do_not_mutate_patterns = ["^\\s*help=(\"[^\"]*\"\\s*)+,?\\s*$", "^\\s*(description|formatter_class)=[\\w.]+,?\\s*$"]
mutate_only_covered_lines = true
pytest_add_cli_args = ["-p", "no:jaxtyping"]
source_paths = ["."]
